# ASENT gate for InvoiceHub. Based on the reusable workflow in SheharyarAli-Dev/Working-POC
# (.github/workflows/asent-gate.yml, caller template docs/gate/asent-pr.yml), inlined so the private
# ASENT repository is checked out with ASENT_REPO_TOKEN.
#
# Runs `asent gate` on the pull request's base and head commits. The authority is .asent/ at the BASE
# commit. Exit codes: 0 ACCEPT, 1 BLOCK, 2 REVIEW. The job fails unless the exit code is 0.
name: ASENT gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: asent-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  asent-gate:
    name: ASENT gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the project (full history, so the base commit exists)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out ASENT
        uses: actions/checkout@v4
        with:
          repository: SheharyarAli-Dev/Working-POC
          ref: master
          path: asent
          token: ${{ secrets.ASENT_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: asent/requirements.lock.txt

      - name: Install ASENT
        run: python -m pip install -r asent/requirements.lock.txt

      # Same as ASENT's satra-ci.yml: build asent-sandbox:local, then require the engine and the image.
      - name: Build the SATRA sandbox image
        run: bash asent/scripts/satra_build_sandbox.sh

      - name: Require Docker engine and built sandbox image
        run: |
          docker info >/dev/null
          docker image inspect asent-sandbox:local >/dev/null
          docker image inspect asent-satra-runner:local >/dev/null
      - name: Run the gate
        id: gate
        working-directory: asent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ASENT_PYTHON: python
        run: |
          set +e
          ./scripts/asent gate --repository "$GITHUB_WORKSPACE" --base "$BASE_SHA" --head "$HEAD_SHA" --output-dir .
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "ASENT gate exit code: $code"

      - name: Append the summary to the job summary
        if: always()
        working-directory: asent
        run: |
          if [ -f asent-summary.md ]; then
            cat asent-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ASENT wrote no summary (exit '${{ steps.gate.outputs.exit_code }}')." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the ASENT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asent-gate-report
          path: |
            asent/asent-report.json
            asent/asent-summary.md
          if-no-files-found: warn

      - name: Apply the decision
        if: always()
        env:
          CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          case "$CODE" in
            "0") echo "ASENT: ACCEPT" ;;
            "1") echo "::error::ASENT: BLOCK (see the job summary and the asent-gate-report artifact)"; exit 1 ;;
            "2") echo "::error::ASENT: REVIEW needed (see the job summary and the asent-gate-report artifact)"; exit 1 ;;
            *)   echo "::error::ASENT: no decision (exit '$CODE')"; exit 1 ;;
          esac
